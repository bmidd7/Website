<!DOCTYPE html>
{% load static %}
<html lang="en">

    <head>
        <meta charset="utf-8">

        <link rel="shortcut icon" type="image/ico" href="{% static 'img/favicon.ico' %}">
        <link rel="stylesheet" href="{% static 'css/basehtml/basehtml.css' %}?v=20260322b">

        <title>
            {% block title %}
            {% endblock %}
        </title>

        {% block extra-css %}
        {% endblock %}
    </head>


    <body>
        <div id="wrapper-div"><!-- Used to allow main content and sidepanel to be part of a flex box, so content can move over when sidebar is opened -->
            <nav id="sidebar" class="sidebar">
                <div id="top-sidebar-buttons">
                    <div id="close-sidebar-div">
                        <button id="close-sidebar"  class="sidebar-buttons hover-over-buttons">
                            ☰
                        </button>
                    </div>
                    <div id="sidebar-logo-div" class="sidebar-buttons hover-over-buttons">
                        <a href="/" name="sidebar-logo-link">
                            <img src="{% static 'img/logo.png' %}" id="sidebar-logo" alt="Website Logo | Return to Home Page">
                        </a>
                    </div>
                    <div id="app-specific-logo" class="sidebar-buttons hover-over-buttons">
                        {% block app-specific-logo-in-sidebar %}
                        {% endblock %}
                    </div>
                    <div id="settings-button-div">
                        <a href="/settings/" id="settings-button-link" class="sidebar-buttons hover-over-buttons no-underline">
                            <button id="settings-button" class="sidebar-buttons hover-over-buttons">
                                ⚙
                            </button>
                        </a>          
                    </div>
                </div>
                <details>
                    <summary id="feedback-summary">
                        Feedback
                    </summary>
                    <div id="feedback-div">
                        <form id="feedback-box">
                            <textarea id="feedback-textarea" name="feedback" rows="4" cols="15" placeholder="Enter your feedback here..."></textarea>

                            <br>

                            <div id="feedback-type-selection">
                                <fieldset id="feedback-type-fieldset">
                                    <legend id="feedback-legend">
                                        What type of feedback are you providing?
                                    </legend>
                                    <div id="feedback-type-checkbox-div">
                                        <label>
                                            <input type="checkbox" class="squircle">
                                            TEST
                                        </label>
                                    </div>
                                </fieldset>
                            </div>

                            <button type="submit" id="submit-feedback-button">Submit</button>
                        </form>
            
                    </div>  
                </details>
                <div id="sidebar-handle">
                    <div id="sidebar-handle-color">
                    <!--Nothing here, just so you can resize the sidebar 😄-->
                    </div>
                </div>
            </nav>



            <main name="main-wrapper" id="main-wrapper">
                {% block main %}
                {% endblock %}
            </main>
        </div>

        <script type="module" src="{% static 'js/basehtml/sidebar/open.js' %}"></script>
        <script type="module" src="{% static 'js/basehtml/sidebar/resize.js' %}"></script>
        {% block extra_js %}
        {% endblock %}
    </body>
</html>
