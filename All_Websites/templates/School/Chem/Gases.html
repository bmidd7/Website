{% extends 'base.html' %}
{% load static %}


{% block title %}
    Chemistry
{% endblock %}

{% block app-specific-logo-in-sidebar %}
<a>

</a>
{% endblock %}


{% block main %} <!--<main name="main" id="main">-->
    <header id="header">
        <div id="open-sidebar-div">
            <button id="open-sidebar" class="open-sidebar hover-over-buttons">
                ☰
            </button>
        </div>

        <div id="open-app-settings">
            <button>
                ⚙
            </button>
        </div>
    </header>


    <main id="main">
        <div id="givens-container">
            <div id="givens">
                <legend id="givens-legend">
                    Givens
                </legend>


                <div id="givens-wrapper">
                    <div id="before-givens">
                        <legend id="before-given-legend">
                            Before
                        </legend>
                        <div id="before-given-type-text-div" class="givens-grid">
                            <div class="grid-corner"></div>
                            <div class="grid-header">Amount</div>
                            <div class="grid-header">Unit</div>

                            <div class="grid-label">Volume</div>
                            <input type="number" min="0" id="before-volume-given">
                            <select id="before-volume-unit-given">
                                <option value="" disabled selected>Select unit</option>
                            </select>

                            <div class="grid-label">Pressure</div>
                            <input type="number" min="0" id="before-pressure-given">
                            <select id="before-pressure-unit-given">
                                <option value="" disabled selected>Select unit</option>
                            </select>

                            <div class="grid-label">Temperature</div>
                            <input type="number" id="before-temperature-given">
                            <select id="before-temperature-unit-given">
                                <option value="" disabled selected>Select unit</option>
                            </select>
                        </div>
                    </div>

                    <div id="after-givens">
                        <legend id="after-given-legend">
                            After
                        </legend>
                        <div id="after-given-type-text-div" class="givens-grid">
                            <div class="grid-corner"></div>
                            <div class="grid-header">Amount</div>
                            <div class="grid-header">Unit</div>

                            <div class="grid-label">Volume</div>
                            <input type="number" min="0" id="after-volume-given">
                            <select id="after-volume-unit-given">
                                <option value="" disabled selected>Select unit</option>
                            </select>

                            <div class="grid-label">Pressure</div>
                            <input type="number" min="0" id="after-pressure-given">
                            <select id="after-pressure-unit-given">
                                <option value="" disabled selected>Select unit</option>
                            </select>

                            <div class="grid-label">Temperature</div>
                            <input type="number" id="after-temperature-given">
                            <select id="after-temperature-unit-given">
                                <option value="" disabled selected>Select unit</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <link rel="stylesheet" href="{% static 'css/School/Chem.css' %}">
{% endblock %}
