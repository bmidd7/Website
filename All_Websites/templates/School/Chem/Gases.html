{% extends 'base.html' %}
{% load static %}


{% block title %}
    Hub
{% endblock %}

{% block app-specific-logo-in-sidebar %}
<a>

</a>
{% endblock %}


{% block main %} <!--<main name="main" id="main">-->
    <div id="header">
        <div id="open-sidebar-div">
            <button id="open-sidebar" class="open-sidebar hover-over-buttons">
                ☰
            </button>
        </div>

        <div id="open-app-settings">
            <button>
                ⚙
            </button>
        </div>
    </div>


    <div id="main-forreal">
        <div id="givens">
            <legend id="givens-legend">
                Givens
            </legend>

            <div id="before-given">
                <legend id="after-given-legend">
                    Before
                </legend>
                <div id="before-given-type-text-div">
                    <label>
                        <input type="text" id="before-volume-given">
                        Volume
                    </label>
                    <label>
                        <input type="text" id="before-pressure-given">
                        Pressure
                    </label>
                    <label>
                        <input type="text">
                        Temperature
                    </label>
                </div>
            </div>

            <div id="after-given">
                <legend id="after-given-legend">
                    After
                </legend>
                <div id="after-given-type-text-div">
                    <label>
                        <input type="text">
                        Volume
                    </label>
                    <label>
                        <input type="text">
                        Pressure
                    </label>
                    <label>
                        <input type="text">
                        Temperature
                    </label>
                </div>
            </div>
        </div>
    </div>

    <link rel="stylesheet" href="{% static 'css/Hub/userHub.css' %}">
{% endblock %}
