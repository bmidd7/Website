<!DOCTYPE html>
<html lang="en">
    <head>
        <title>
            Login
        </title>
        <meta charset="utf-8">
    </head>
    <body>
        <h1>Login</h1>
        {% if messages %}
            {% for message in messages %}
                <p>{{ message }}</p>
            {% endfor %}
        {% endif %}
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Login</button>
        </form>
        {% load socialaccount %}
        <p>
            <a href="{% provider_login_url 'google' process='login' %}">Continue with Google</a>
        </p>
        <p>
            <a href="{% url 'mfa_login_webauthn' %}">Sign in with a passkey</a>
        </p>
    </body>
</html>
